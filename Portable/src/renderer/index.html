<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!--
      No remote anything. The renderer shows PDFs and text that came from
      files the user did not write, so it is given no way to reach the network
      and no way to run anything it did not ship with.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' blob:; worker-src 'self' blob:;"
    />
    <title>Paper Time</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.js"></script>
  </body>
</html>
