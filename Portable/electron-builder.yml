# How Paper Time is packaged for Windows and Linux.
#
# The same `out/` bundle goes into every package — one Chromium, one
# stylesheet, one bundled typeface — so the three builds differ only in how
# the operating system is told to install them.
appId: com.imtaeheon.PaperTime
productName: Paper Time
copyright: © 2026 Taeheon Im

directories:
  output: dist
  buildResources: assets

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!node_modules/**/*'

# pdf-lib and pdfjs-dist are bundled into `out/` by esbuild, so nothing from
# node_modules needs to travel with the app.
asar: true

# The text index runs in a process of its own and reads papers on threads of
# its own, and a thread is started from a file on disk: Node's worker loader
# does not look inside an archive. Both scripts are self-contained bundles, so
# they are all that has to come out.
asarUnpack:
  - out/main/textService.js
  - out/main/textWorker.js
  # Search by meaning: the runtime loads its WebAssembly and its glue module
  # from files, and reads the model from one.
  - out/main/semantic.js
  - out/main/semantic/**

# ---------------------------------------------------------------- Windows
win:
  icon: assets/icons/icon.ico
  target:
    # The installer most people will use…
    - target: nsis
      arch: [x64, arm64]
    # …and a folder that runs from a memory stick, for a machine where
    # installing anything needs an administrator.
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
  # An unsigned build is what a free developer account can make. Windows will
  # show SmartScreen's warning the first time; the install page says so.
  signAndEditExecutable: true

nsis:
  oneClick: false
  # Installing only for the person running it needs no administrator, and its
  # default folder is theirs: %LOCALAPPDATA%\Programs\Paper Time. "Anyone who
  # uses this computer" stays on the first page and asks for an administrator
  # when chosen (allowElevation's default); a folder this account cannot write
  # to — Program Files while installing only for me — is caught on the folder
  # page, before anything is installed (assets/installer.nsh).
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Paper Time
  # No uninstallerIcon on purpose: it makes the installer write an .ico into
  # the folder first thing, and on an upgrade that name was still held by the
  # uninstaller that had just deleted it (see assets/installer.nsh). Without
  # it the uninstaller wears this icon and Settings → Apps shows the app's own
  # — the same picture.
  installerIcon: assets/icons/icon.ico
  # A library folder is the user's own; uninstalling the app never touches it.
  deleteAppDataOnUninstall: false
  # The build resources folder, like the icons — not `build/`, which this
  # repository ignores everywhere.
  include: assets/installer.nsh

portable:
  artifactName: '${productName} ${version} portable.${ext}'

# ------------------------------------------------------------------ Linux
linux:
  icon: assets/icons
  category: Office
  synopsis: A reader, a pen and a bibliography for papers
  description: >
    Paper Time is a reader for academic papers that writes what you mark into
    the PDF itself — highlights, underlines, handwriting, shapes and arrows —
    so the file alone carries your reading, and your library is a folder you
    can put anywhere.
  desktop:
    entry:
      Name: Paper Time
      Comment: Read, annotate and cite papers
      Keywords: pdf;paper;research;bibliography;annotate;
      MimeType: application/pdf
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64]
    - target: tar.gz
      arch: [x64, arm64]

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

appImage:
  artifactName: '${productName}-${version}-${arch}.${ext}'

# -------------------------------------------------------------------- Mac
# Here mainly so the same build can be run and checked on the machine it is
# written on; the Mac's own app is the Swift one.
mac:
  icon: assets/icons/icon.png
  category: public.app-category.productivity
  target:
    - target: dir
      arch: [arm64]
