name: PaperTime
options:
  bundleIdPrefix: com.imtaeheon
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

packages:
  PaperTimeKit:
    path: Packages/PaperTimeKit

targets:
  PaperTime:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - package: PaperTimeKit
        product: PaperCore
      - package: PaperTimeKit
        product: LibraryStore
      - package: PaperTimeKit
        product: Bibliography
      - package: PaperTimeKit
        product: MetadataPipeline
      - package: PaperTimeKit
        product: InkEngine
      - package: PaperTimeKit
        product: PDFReader
      - package: PaperTimeKit
        product: Importers
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Paper Time
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.imtaeheon.PaperTime.paper
            UTTypeDescription: Paper Time Paper
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {}
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            LSItemContentTypes: [com.adobe.pdf]
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imtaeheon.PaperTime
        # The sandbox keys are macOS-only. Applying them to an iOS build makes
        # signing with a free Apple ID fail for no reason: iOS apps are always
        # sandboxed and need no entitlement for the document picker or network.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Resources/PaperTime-macOS.entitlements
        PRODUCT_NAME: Paper Time
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
