name: PaperTime
options:
  bundleIdPrefix: com.imtaeheon
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "14.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.9.25"
    # The same as the version people see. Sparkle compares CFBundleVersion,
    # and a build number that was "1" in every release would never be newer.
    CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Weak, because the app runs back to macOS 14 and the framework does not
    # exist there: a strong load command would have dyld refuse the whole app
    # at launch. Every use is behind `#available(macOS 26, *)`.
    OTHER_LDFLAGS: ["-weak_framework", "FoundationModels"]

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

packages:
  PaperTimeKit:
    path: Packages/PaperTimeKit
  # Updates on the Mac: Sparkle downloads, checks the EdDSA signature and
  # swaps the app in place. Paper Time draws its own notice and drives Sparkle
  # through a user driver of its own (App/Model/SparkleInstaller.swift).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
  # The formula lasso's OCR (App/Model/FormulaOCR.swift): ONNX Runtime, as a
  # static library from Microsoft's own Swift package — about 20 MB per
  # architecture in the binary, nothing embedded, no entitlement. The models
  # ride in App/Resources/MathOCR.
  onnxruntime-swift-package-manager:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.24.2
  # Handwriting (App/Model/Handwriting*.swift): a vision-language model —
  # Qwen3.5, Apache-2.0 — run on this Mac by MLX. The weights are not in the
  # app; they are downloaded on request into Application Support. MLX breaks
  # its API between minor versions, hence the pin to the minor. Building it
  # needs Xcode's Metal toolchain (`xcodebuild -downloadComponent
  # MetalToolchain`), and it runs on Apple silicon only, which is all the app
  # is built for.
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    minorVersion: 3.32.3
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0

targets:
  PaperTime:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - package: PaperTimeKit
        product: PaperCore
      - package: PaperTimeKit
        product: LibraryStore
      - package: PaperTimeKit
        product: Bibliography
      - package: PaperTimeKit
        product: MetadataPipeline
      - package: PaperTimeKit
        product: InkEngine
      - package: PaperTimeKit
        product: PDFReader
      - package: PaperTimeKit
        product: Importers
      # Search by meaning: the MiniLM model and its vocabulary ride in the
      # package's resource bundle, which Xcode copies into the app.
      - package: PaperTimeKit
        product: Semantic
      - package: Sparkle
        product: Sparkle
        destinationFilters: [macOS]
      - package: onnxruntime-swift-package-manager
        product: onnxruntime
        destinationFilters: [macOS]
      - package: mlx-swift-lm
        product: MLXVLM
        destinationFilters: [macOS]
      - package: mlx-swift-lm
        product: MLXLMCommon
        destinationFilters: [macOS]
      - package: swift-transformers
        product: Tokenizers
        destinationFilters: [macOS]
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Paper Time
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Updates (macOS; iOS ignores these). The feed is the page's own; the
        # key is the public half of Scripts/sparkle-key.sh's. Sparkle never
        # checks on its own schedule — UpdateCenter decides when to look and
        # draws the notice — and the sandbox needs the installer service.
        SUFeedURL: https://icecoffee2500.github.io/paper-time/appcast.xml
        SUPublicEDKey: ZDlj4EL5cmnpF1VR5e4WaqVC6Dlf1tjPCCMWUUEJA4c=
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.imtaeheon.PaperTime.paper
            UTTypeDescription: Paper Time Paper
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {}
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            LSItemContentTypes: [com.adobe.pdf]
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
          # A folder dropped on the app becomes the library. Declared so that
          # Launch Services hands the folder over rather than opening it in
          # the Finder — and with it the right to read inside, which is the
          # only way a sandboxed app reaches ~/Library/CloudStorage without
          # an open panel.
          - CFBundleTypeName: Folder
            LSItemContentTypes: [public.folder]
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imtaeheon.PaperTime
        # A Mac app keeps its frameworks in Contents/Frameworks, next to
        # MacOS/ rather than inside it — the multiplatform default is the iOS
        # layout, and with Sparkle (the first embedded framework) dyld looked
        # in Contents/MacOS/Frameworks and refused to start the app.
        LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]: $(inherited) @executable_path/../Frameworks
        # The sandbox keys are macOS-only. Applying them to an iOS build makes
        # signing with a free Apple ID fail for no reason: iOS apps are always
        # sandboxed and need no entitlement for the document picker or network.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Resources/PaperTime-macOS.entitlements
        PRODUCT_NAME: Paper Time
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
